name = "decap-oauth"
main = "index.js"
compatibility_date = "2026-08-01"

# 部署步驟（在 oauth-proxy/ 目錄裡執行）：
#
#   1. 到 GitHub → Settings → Developer settings → OAuth Apps → New OAuth App
#      - Homepage URL：https://<你的帳號>.github.io/hugo-decap-demo/
#      - Authorization callback URL：https://decap-oauth.<你的帳號>.workers.dev/callback
#        （網址要等第 2 步部署完才知道，可以先隨便填，之後回來改）
#
#   2. npx wrangler deploy
#
#   3. npx wrangler secret put GITHUB_CLIENT_ID
#      npx wrangler secret put GITHUB_CLIENT_SECRET
#      （選用）npx wrangler secret put ALLOWED_ORIGIN   例如 https://<你的帳號>.github.io
#
#   4. 把部署後的 Worker 網址填進 static/admin/config.yml 的 base_url
